name: Vérification structurelle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Cohérence du plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Aucune dépendance : le script n'utilise que la bibliothèque standard.
      - name: Vérifier la structure du plugin
        run: python3 scripts/check_plugin.py

  jeu-essai:
    name: Jeu d'essai (check_dossier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Les jeux d'essai vivent sur une branche orpheline : hors du tree distribué du
      # plugin, mais c'est le seul test de bout en bout de check_dossier.py. Sans ce
      # job, deux défauts silencieux y sont déjà passés inaperçus.
      - name: Récupérer la branche orpheline
        # Dépend de la persistance des identifiants par actions/checkout — mécanisme
        # qui a changé en v6 (« persist creds to a separate file »). Si un jour ce
        # fetch échoue en 403 après une montée de version, c'est ici qu'il faut
        # regarder, et `persist-credentials: true` explicite est le premier essai.
        run: |
          git fetch --no-tags --depth=1 origin jeu-essai:jeu-essai
          git worktree add ../jeux-essai jeu-essai

      - name: jpo-800 sort en exit 1, avec sa seule erreur documentée
        # L'erreur est ATTENDUE : `--no-annotations` évite que la course s'affiche en
        # rouge alors qu'elle valide le comportement nominal. Ne PAS tenter de forcer
        # GITHUB_ACTIONS=false ici — c'est une variable réservée, le runner la
        # réinjecte, et les annotations reviennent dans la sortie qu'on analyse.
        run: |
          set +e
          sortie=$(python3 scripts/check_dossier.py ../jeux-essai/jpo-800 --no-annotations 2>&1)
          code=$?
          set -e
          printf '%s\n' "$sortie"
          [ "$code" -eq 1 ] || { echo "::error::attendu exit 1, obtenu $code"; exit 1; }
          erreurs=$(printf '%s\n' "$sortie" | grep -c '^✗' || true)  # ancré : une annotation porte le même texte
          [ "$erreurs" -eq 1 ] || { echo "::error::attendu 1 erreur, obtenu $erreurs"; exit 1; }
          printf '%s\n' "$sortie" | grep -q '03-prestataires.md' \
            || { echo "::error::l'erreur attendue ne porte pas sur 03-prestataires.md"; exit 1; }
          echo "✓ jeu d'essai conforme à son README"

      - name: convention-250 sort en exit 0, cycles toujours détectés
        # Le pendant sain de jpo-800. Il verrouille la propriété qui manquait le plus :
        # un dossier correctement tenu PEUT être vert. Avant la correction du cycle
        # 02↔03, aucun dossier réel ne le pouvait.
        run: |
          set +e
          sortie=$(python3 scripts/check_dossier.py ../jeux-essai/convention-250 --no-annotations 2>&1)
          code=$?
          set -e
          printf '%s\n' "$sortie"
          [ "$code" -eq 0 ] || { echo "::error::attendu exit 0, obtenu $code"; exit 1; }
          cycles=$(printf '%s\n' "$sortie" | grep -c '^⚠  cycle 0' || true)
          # Si les avertissements disparaissent, ce n'est pas une bonne nouvelle :
          # c'est que la détection des cycles a cessé de fonctionner.
          [ "$cycles" -eq 2 ] || { echo "::error::attendu 2 avertissements de cycle, obtenu $cycles"; exit 1; }
          echo "✓ dossier sain vert, et les deux cycles sont toujours vus"
